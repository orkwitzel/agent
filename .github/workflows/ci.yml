name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: >
          dnf install -y python3 python3-pip python3-gobject gtk4 libadwaita
          python3-markdown-it-py python3-pydantic meson ninja-build glib2-devel
          blueprint-compiler desktop-file-utils appstream gettext
      - name: Install dev tools
        run: |
          python3 -m venv --system-site-packages .venv
          PYGOBJECT_STUB_CONFIG=Gtk4,Gdk4 .venv/bin/pip install --group dev
      - name: Lint, type check and test
        run: |
          export PATH=$PWD/.venv/bin:$PATH
          meson setup build -Ddev=true
          meson test -C build --print-errorlogs

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: agent.flatpak
          manifest-path: build-aux/flatpak/io.github.orkwitzel.Agent.json
          cache-key: flatpak-builder-${{ github.sha }}
