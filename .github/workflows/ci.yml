name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: >
          dnf install -y python3 python3-gobject gtk4 libadwaita python3-pytest
          python3-markdown-it-py ruff meson ninja-build glib2-devel blueprint-compiler
          desktop-file-utils appstream gettext
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -v
      - name: Meson build and validation tests
        run: |
          meson setup build
          meson test -C build --print-errorlogs

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: agent.flatpak
          manifest-path: build-aux/flatpak/io.github.orkwitzel.Agent.json
          cache-key: flatpak-builder-${{ github.sha }}
